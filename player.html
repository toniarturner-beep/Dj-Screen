<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="p"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  var q = new URLSearchParams(location.search);
  var v = q.get('v');
  var start = parseInt(q.get('start') || '0', 10);

  function onYouTubeIframeAPIReady() {
    if (!v) return;
    new YT.Player('p', {
      videoId: v,
      width: '100%',
      height: '100%',
      playerVars: {
        autoplay: 1, mute: 1, controls: 0, disablekb: 1, modestbranding: 1,
        rel: 0, iv_load_policy: 3, playsinline: 1, start: start,
        origin: location.origin
      },
      events: {
        onReady: function (e) { e.target.mute(); e.target.playVideo(); }
      }
    });
  }
</script>
</body>
</html>
